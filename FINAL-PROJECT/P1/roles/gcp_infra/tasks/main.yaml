---
- name: Slurp local public SSH key
  ansible.builtin.slurp:
    src: "{{ ssh_public_key }}"
  register: ssh_pub_key

- name: Create Static NAT IPs in GCP
  google.cloud.gcp_compute_address:
    name: "{{ item.static_ip }}"
    region: "{{ (item.zone | default(default_spec.zone)) | regex_replace('-[a-z]$', '') }}"
    project: "{{ google_project_id }}"
    address_type: EXTERNAL
    auth_kind: application
    state: present
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_path }}"
  loop: "{{ machine_info }}"
  loop_control:
    label: "{{ item.name }}"
  register: gcp_static_ips

- name: Build static IP lookup dictionary
  ansible.builtin.set_fact:
    ip_map: "{{ ip_map | default({}) | combine({item.item.name: item.address}) }}"
  loop: "{{ gcp_static_ips.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Create GCP Compute Instances
  google.cloud.gcp_compute_instance:
    name: "{{ item.name }}"
    machine_type: "{{ item.machine_type | default(default_spec.machine_type) }}"
    zone: "{{ item.zone | default(default_spec.zone) }}"
    project: "{{ google_project_id }}"
    auth_kind: application
    state: present
    metadata:
      ssh-keys: "{{ ansible_user }}:{{ (ssh_pub_key['content'] | b64decode) | trim }}"
    disks:
      - auto_delete: true
        boot: true
        initialize_params:
          disk_size_gb: "{{ item.disk_size | default(default_spec.disk_size) }}"
          disk_type: "{{ item.disk_type | default(default_spec.disk_type) }}"
          source_image: "{{ item.image | default(default_spec.image) }}"
    network_interfaces:
      - network:
          selfLink: "projects/{{ google_project_id }}/global/networks/default"
        access_configs:
          - name: External NAT
            type: ONE_TO_ONE_NAT
            nat_ip:
              address: "{{ ip_map[item.name] }}"
    tags:
      items:
        - http-server
        - https-server
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_path }}"
    GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
  loop: "{{ machine_info }}"
  loop_control:
    label: "{{ item.name }}"
  register: gcp_instances

- name: Save instance IPs to inventory.ini
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/inventory.ini.j2"
    dest: "{{ playbook_dir }}/../inventory.ini"

- name: Register created instances dynamically into active inventory
  ansible.builtin.add_host:
    name: "{{ item.item.name }}"
    ansible_host: "{{ item.gcp_instance.networkInterfaces[0].accessConfigs[0].natIP }}"
    groups: >-
      {% if item.item.role == "jenkins" or item.item.name == "jenkins" or item.item.name == "ts-node01" %}
      jenkins_servers
      {% elif item.item.role == "sonarqube" or item.item.name == "sonarqube" or item.item.name == "ts-node02" %}
      sonarqube_servers
      {% elif item.item.role == "nexus" or item.item.name == "nexus" or item.item.name == "ts-node03" %}
      nexus_servers
      {% endif %}
  loop: "{{ gcp_instances.results }}"
  when:
    - item.gcp_instance is defined
    - item.gcp_instance.networkInterfaces is defined