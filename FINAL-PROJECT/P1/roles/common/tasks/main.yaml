- name: Install system packages
  ansible.builtin.apt:
    name:
      - tree
      - gh
      - zsh
      - curl
      - git
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Resolve user home directory
  ansible.builtin.set_fact:
    target_user_home: "{{ ansible_user }}"

- name: Check if Oh My Zsh is installed
  ansible.builtin.stat:
    path: "{{ target_user_home }}/.oh-my-zsh/oh-my-zsh.sh"
  register: omz_stat

- name: Check if Oh My Zsh directory exists
  ansible.builtin.stat:
    path: "{{ target_user_home }}/.oh-my-zsh"
  register: omz_dir_stat

- name: Remove incomplete Oh My Zsh directory
  ansible.builtin.file:
    path: "{{ target_user_home }}/.oh-my-zsh"
    state: absent
  when:
    - omz_dir_stat.stat.exists
    - not omz_stat.stat.exists

- name: Install Oh My Zsh
  ansible.builtin.shell: |
    RUNZSH=no CHSH=no sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  args:
    executable: /bin/bash
    creates: "{{ target_user_home }}/.oh-my-zsh/oh-my-zsh.sh"
  when: not omz_stat.stat.exists