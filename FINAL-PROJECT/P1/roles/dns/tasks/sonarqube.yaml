- name: Create SonarQube DNS record
  community.general.cloudflare_dns:
    zone: "{{ cloudflare_zone }}"
    record: "sonarqube"
    type: A
    value: "{{ hostvars[groups['sonarqube'][0]]['ansible_host'] }}"
    ttl: 1
    proxied: false
    api_token: "{{ cloudflare_api_token }}"
    state: present