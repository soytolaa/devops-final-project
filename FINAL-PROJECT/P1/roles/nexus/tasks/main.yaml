---
- name: Create Nexus application directory
  ansible.builtin.file:
    path: "{{ nexus_app_dir }}"
    state: directory
    mode: "0755"

- name: Create Nexus persistent storage directory
  ansible.builtin.file:
    path: "{{ nexus_data_dir }}"
    state: directory
    owner: "200"
    group: "200"
    mode: "0755"

- name: Deploy Nexus Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nexus_app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Launch Nexus service via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ nexus_app_dir }}"
    state: present

- name: Deploy Nexus Nginx configuration
  ansible.builtin.template:
    src: nexus.conf.j2
    dest: /etc/nginx/conf.d/nexus.conf
    mode: "0644"

- name: Test Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Reload Nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded