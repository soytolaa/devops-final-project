---
- name: Set vm.max_map_count sysctl limit for Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "524288"
    state: present
    reload: true

- name: Create SonarQube application directory
  ansible.builtin.file:
    path: "{{ sonarqube_app_dir }}"
    state: directory
    mode: "0755"

- name: Create SonarQube storage directories
  ansible.builtin.file:
    path: "{{ sonarqube_base_dir }}/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - data
    - extensions
    - logs

- name: Deploy SonarQube Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ sonarqube_app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Launch SonarQube service via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ sonarqube_app_dir }}"
    state: present

- name: Deploy SonarQube Nginx configuration
  ansible.builtin.template:
    src: sonarqube.conf.j2
    dest: /etc/nginx/conf.d/sonarqube.conf
    mode: "0644"

- name: Test Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Reload Nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded